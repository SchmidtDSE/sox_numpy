[build-system]
requires = ["setuptools", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "sox_numpy"
version = "0.1.0"
readme = "README.md"
description = "NumPy generation of SoX-style spectrograms"
license = {text = "CC-BY-4.0"}
authors = [
	{name = "Brookie Guzder-Williams", email = "bguzder-williams@berkeley.edu"}
]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Science/Research",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Topic :: Scientific/Engineering"
]
requires-python = ">=3.11"
dependencies = [
	"numpy >=2,<3",
	"soundfile >=0.13.1,<0.14",
	"soxr >=0.3.0",
]

[project.optional-dependencies]
# Writing PNGs with `dest`
png = ["pillow>=10"]
# Comparison and analysis tools (the PNW-Cnet model also needs TensorFlow:
# see the pixi `compare` environment)
comparison = [
	"click>=8",
	"pillow>=10",
	"boto3",
	"pyyaml",
	"pandas",
	"matplotlib",
	"seaborn",
	"jupyter",
	"ipykernel",
]

[project.scripts]
compare-spectrograms = "comparison.compare_spectrograms:main"
compare-model        = "comparison.compare_model:main"

[tool.setuptools]
packages = [
	"sox_numpy",
	"comparison",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
# canister-worm-protection
exclude-newer = "2026-03-12"

[tool.pixi.pypi-dependencies]
sox_numpy = { path = ".", editable = true }

[tool.pixi.dependencies]
python = ">=3.11,<3.12"

[tool.pixi.environments]
default = { features = [] }
dev     = { features = ["dev"] }
test    = { features = ["test"] }
# The comparison harness: TensorFlow for the PNW-Cnet model, and the sox binary
compare = { features = ["compare"] }

[tool.pixi.feature.dev.dependencies]
twine = "*"

[tool.pixi.feature.dev.pypi-dependencies]
build = "*"
h5py = ">=3.15.1,<4"

[tool.pixi.feature.test.dependencies]
pytest = ">=8,<9"

[tool.pixi.feature.test.tasks]
test = "pytest"

[tool.pixi.feature.test.pypi-dependencies]
sox_numpy = { path = ".", extras = ["png"], editable = true }

# conda-forge has no sox for linux-aarch64; there, put sox on PATH yourself
[tool.pixi.feature.compare.target.linux-64.dependencies]
sox = "*"

[tool.pixi.feature.compare.target.osx-arm64.dependencies]
sox = "*"

[tool.pixi.feature.compare.pypi-dependencies]
sox_numpy = { path = ".", extras = ["png", "comparison"], editable = true }

# TensorFlow — platform-specific, only for the comparison harness
[tool.pixi.feature.compare.target.linux-64.pypi-dependencies]
tensorflow = ">=2.18.0"
tf_keras = "*"

[tool.pixi.feature.compare.target.linux-aarch64.pypi-dependencies]
tensorflow = ">=2.18.0"
tf_keras = "*"

[tool.pixi.feature.compare.target.osx-arm64.pypi-dependencies]
# tensorflow-metal 1.2.0 fails to load on TF >=2.20
tensorflow = ">=2.18.0,<2.20.0"
tensorflow-metal = ">=1.2.0,<2"
tf_keras = ">=2.18.0,<2.20.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
